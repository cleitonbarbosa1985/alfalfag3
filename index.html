<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Xilofone Mágico</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header class="app-header">
    <h1>🎶 Xilofone Mágico</h1>
    <button id="muteBtn" class="icon-btn" title="Som" aria-label="Ligar ou desligar o som">🔊</button>
  </header>

  <main>

    <section id="stage" class="stage">
      <div id="noteDisplay" class="note-display">
        <span id="noteName">🎵</span>
      </div>
      <div id="lyricCaption" class="lyric-caption">Toca uma tecla colorida para começar!</div>

      <div id="progressWrap" class="progress-wrap" hidden>
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="xylophone" class="xylophone" aria-label="Xilofone"></div>

      <div id="legend" class="legend"></div>
    </section>

    <section id="controls" class="controls">
      <button id="listenBtn" class="big-btn listen" disabled>▶️<span>Ouvir</span></button>
      <button id="practiceBtn" class="big-btn practice" disabled>👐<span>Tocar</span></button>
      <button id="stopBtn" class="big-btn stop" hidden>⏹️<span>Parar</span></button>
      <button id="speedBtn" class="big-btn speed">🐢<span>Devagar</span></button>
      <button id="freeBtn" class="big-btn free">🎹<span>Livre</span></button>
    </section>

    <section id="songPicker" class="song-picker">
      <h2 class="picker-title">Escolha uma música</h2>
      <div id="cantigasRow" class="song-row"></div>
      <h2 class="picker-title brincadeira-title">Brincadeira 🤸</h2>
      <div id="brincadeiraRow" class="song-row"></div>
      <h2 class="picker-title gospel-title">Louvor 🙌</h2>
      <div id="gospelRow" class="song-row"></div>
    </section>

  </main>

  <div id="toast" class="toast" hidden></div>
</div>

<div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
